name: Fork Probe Mismatch

# Diagnostic only. Registers nothing that matters: a push trigger whose branch
# filter does NOT match the branch being pushed. Used to learn whether a fork
# registers a newly added workflow file merely because the file carries a push
# trigger, or only once the filter actually matches and the workflow runs.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "ci/never-pushed-anywhere"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "probe-mismatch"
