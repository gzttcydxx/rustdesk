name = "rustdesk-selfhost-api"
main = "src/index.ts"
compatibility_date = "2026-09-20"

# The client points its API base URL at this host. `custom_domain = true` makes
# Cloudflare create the DNS record and certificate, so no CNAME is needed.
#
# Keep this above the [[d1_databases]] table: in TOML a bare key after a table
# header belongs to that table, and wrangler would report "unexpected field
# routes in d1_databases[0]" instead of registering the route.
routes = [
  { pattern = "rd.gzttc.qzz.io", custom_domain = true }
]

# D1 replaces the sqlite3 file the Python server uses.
#
# `--local` development works with any id, so the whole contract test suite can
# run before an account is involved:  ./run-contract-test.sh
# The id below is the deployed database (region WNAM).
[[d1_databases]]
binding = "DB"
database_name = "rustdesk-selfhost-api"
database_id = "5b60cd2b-85e6-4e07-91d9-4f04f1028f67"

[vars]
# "true" rejects anonymous sessions and unknown logins, like
# `rustdesk_api_server.py --strict-auth`. Leave it off: anonymous sessions are
# what makes the login-free address book / accessible devices pages work.
STRICT_AUTH = "false"

# ACCESS_TOKEN is deliberately not set here. It is the shared secret that every
# API request must carry as its first path segment, and it belongs in a secret
# rather than in git:
#
#   npx wrangler secret put ACCESS_TOKEN
#
# Then set the client's API Server to `https://rd.gzttc.qzz.io/<the secret>`.
# While it is unset the API is open to anyone who knows the hostname.
